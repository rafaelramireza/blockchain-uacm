name: UACM Blockchain Smart Contract CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-verify:
    name: Compilación y Verificación Estática (Go)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: chaincode

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Instalar dependencias
        run: |
          go mod download
          go mod tidy

      - name: Compilar Smart Contract
        run: |
          go build -v ./...

      - name: Verificar formato del código
        run: |
          FILES=$(find . \
            -path "./vendor" -prune -o \
            -name "*.go" -print | xargs gofmt -l)

          if [ -n "$FILES" ]; then
            echo "Error: Los siguientes archivos no cumplen con el formato oficial de Go:"
            echo "$FILES"
            exit 1
          fi

      - name: Ejecutar pruebas unitarias
        run: |
          go test -v ./...