name: UACM Blockchain Smart Contract CI

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: chaincode

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Descargar dependencias
        run: |
          go mod download
          go mod tidy

      - name: Compilar chaincode
        run: go build -v ./...

      - name: Verificar formato
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Archivos sin formato:"
            gofmt -l .
            exit 1
          fi

      - name: Ejecutar pruebas
        run: go test -v ./...
